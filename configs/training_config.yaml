# Model Training Configuration

## Data Configuration
data:
  train_path: "data/raw/train.csv"
  test_path: "data/raw/test.csv"
  test_size: 0.2
  random_state: 42

## Model Configuration
model:
  type: "RandomForestClassifier"
  hyperparameters:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
    n_jobs: -1

## Preprocessing
preprocessing:
  scaler: "StandardScaler"
  handle_missing: "drop"

## Experiment Configuration
experiment:
  name: "itmo_epml_models"
  run_name: "baseline_model_v1"
  tags:
    version: "1.0"
    team: "itmo"
    dataset: "public"

## Logging Configuration
logging:
  level: "INFO"
  save_artifacts: true
  artifact_path: "models/artifacts"
