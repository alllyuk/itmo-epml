# @package _global_
defaults:
  - data: house_prices
  - model: random_forest
  - training: default
  - mlflow: default
  - _self_

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false

  # Parallel execution
  sweeper:
    params:
      model.n_estimators: 50,100,200
      model.max_depth: 5,10,20

project_name: "House Prices Prediction"
seed: 42
debug: false